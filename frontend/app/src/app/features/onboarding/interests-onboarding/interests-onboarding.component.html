<section class="interests-onboarding-page">
  <div class="interests-onboarding-card">
    <div class="interests-onboarding-brand">
      <img
        src="assets/images/loopskill-logo-cropped.png"
        alt="LoopSkill"
        class="interests-onboarding-brand__logo"
      />
    </div>

    <div class="interests-onboarding-header">
      <h1>What do you want to learn?</h1>
      <p>
        Choose the topics that interest you most. We’ll use them to personalize
        your recommendations.
      </p>
    </div>

    <p class="error-message" *ngIf="errorMessage != ''">
      {{ errorMessage }}
    </p>

    <p class="interests-onboarding-hint" *ngIf="isLoading == true">
      Loading interests...
    </p>

    <div
      class="interests-onboarding-list"
      *ngIf="isLoading == false && availableInterests.length > 0"
    >
      <button
        type="button"
        class="interest-chip"
        *ngFor="let interest of availableInterests"
        [class.selected]="isInterestSelected(interest)"
        (click)="toggleInterest(interest)"
        [disabled]="isLoading"
      >
        {{ interest }}
      </button>
    </div>

    <p
      class="interests-onboarding-hint"
      *ngIf="isLoading == false && availableInterests.length === 0"
    >
      No interests available right now.
    </p>

    <p
      class="interests-onboarding-hint"
      *ngIf="isLoading == false && availableInterests.length > 0"
    >
      You can select as many interests as you want.
    </p>

    <div class="interests-onboarding-actions">
      <button
        type="button"
        class="interests-onboarding-skip"
        (click)="skip()"
        [disabled]="isLoading"
      >
        Skip for now
      </button>

      <button
        type="button"
        class="interests-onboarding-finish"
        (click)="finishOnboarding()"
        [disabled]="isLoading"
      >
        {{ isLoading ? 'Saving...' : 'Finish' }}
      </button>
    </div>
  </div>
</section>
