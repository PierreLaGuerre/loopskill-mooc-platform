<section class="home-section">
  <div class="home-section__container">
    <h2 class="home-section__title">Recommended for You</h2>
    <p class="home-section__subtitle">
      Courses selected based on your interests.
    </p>

    <div class="courses-grid">
      <app-course-card
        *ngFor="let course of recommendedCourses"
        [course]="course">
      </app-course-card>
    </div>
  </div>
</section>
