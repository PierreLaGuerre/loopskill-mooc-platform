<section class="home-section">
  <div class="home-section__container">
    <h2 class="home-section__title">Recommended for You</h2>
    <p class="home-section__subtitle">
      Courses selected based on your interests
    </p>

    <div class="courses-carousel">
      <button
        class="courses-carousel__button courses-carousel__button--left"
        type="button"
        aria-label="Previous recommended courses"
        [disabled]="canScrollLeft === false"
        (click)="scrollCourses('left')">
        &lsaquo;
      </button>

      <div
        #coursesTrack
        class="courses-track"
        (scroll)="updateScrollButtons()">
        <app-course-card
          *ngFor="let course of recommendedCourses"
          [course]="course">
        </app-course-card>
      </div>

      <button
        class="courses-carousel__button courses-carousel__button--right"
        type="button"
        aria-label="Next recommended courses"
        [disabled]="canScrollRight === false"
        (click)="scrollCourses('right')">
        &rsaquo;
      </button>
    </div>
  </div>
</section>
