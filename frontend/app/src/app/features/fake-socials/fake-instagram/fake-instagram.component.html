<section class="fake-instagram-page" aria-label="LoopSkill Instagram profile preview">
  <header class="fake-instagram-topbar">
    <img
      class="fake-instagram-wordmark"
      src="assets/images/Instagram-title.png"
      alt="Instagram" />
    <div class="fake-instagram-actions">
      <button type="button">Log in</button>
      <span>Sign up</span>
    </div>
  </header>

  <main class="fake-instagram-profile">
    <section class="fake-instagram-header">
      <div class="fake-instagram-avatar">
        <span aria-label="LoopSkill infinity symbol">∞</span>
      </div>

      <div class="fake-instagram-info">
        <div class="fake-instagram-title-row">
          <h1>loopskill</h1>
          <span class="fake-instagram-verified">✓</span>
          <span class="fake-instagram-menu">⋮</span>
        </div>

        <div class="fake-instagram-stats">
          <span><strong>128</strong> posts</span>
          <span><strong>18.4K</strong> followers</span>
          <span><strong>42</strong> following</span>
        </div>

        <div class="fake-instagram-bio">
          <strong>LoopSkill</strong>
          <p>Learn. Improve. Repeat.</p>
          <p>Programming, cloud, data and DevOps courses for digital builders.</p>
        </div>
      </div>
    </section>

    <section class="fake-instagram-highlights" aria-label="Story highlights">
      <div class="fake-instagram-highlight">
        <span class="fake-instagram-highlight__circle fake-instagram-highlight__circle--green"></span>
        <p>Courses</p>
      </div>
      <div class="fake-instagram-highlight">
        <span class="fake-instagram-highlight__circle fake-instagram-highlight__circle--blue"></span>
        <p>Cloud</p>
      </div>
      <div class="fake-instagram-highlight">
        <span class="fake-instagram-highlight__circle fake-instagram-highlight__circle--orange"></span>
        <p>DevOps</p>
      </div>
      <div class="fake-instagram-highlight">
        <span class="fake-instagram-highlight__circle fake-instagram-highlight__circle--purple"></span>
        <p>Data</p>
      </div>
      <div class="fake-instagram-highlight">
        <span class="fake-instagram-highlight__circle fake-instagram-highlight__circle--teal"></span>
        <p>Learners</p>
      </div>
    </section>

    <nav class="fake-instagram-tabs" aria-label="Profile tabs">
      <span class="fake-instagram-tab fake-instagram-tab--active">▦</span>
      <span class="fake-instagram-tab">▻</span>
      <span class="fake-instagram-tab">▧</span>
    </nav>

    <section class="fake-instagram-grid" aria-label="LoopSkill posts">
      <article class="fake-instagram-post">
        <img src="assets/images/courses/python.png" alt="Python course post" />
      </article>
      <article class="fake-instagram-post">
        <img src="assets/images/courses/react.png" alt="React course post" />
      </article>
      <article class="fake-instagram-post">
        <img src="assets/images/courses/aws.png" alt="AWS course post" />
      </article>
    </section>
  </main>
</section>
